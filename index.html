<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --wine:#7a1416;--wine2:#9c1f1f;--dark:#2a0607;--gold:#c99a2e;--gold2:#f0d27a;
  --cream:#fbf6ec;--paper:#fff;--rose:#f7e9e4;--ink:#3b2a2a;--muted:#8a7570;--line:#efe2cc;--water:#4f8fc0;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Manrope",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --shadow:0 6px 22px rgba(122,20,22,.08),0 1px 3px rgba(122,20,22,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body{background:radial-gradient(1200px 600px at 100% 0%,#f8ead7 0%,transparent 60%),var(--cream);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea{font:inherit;color:var(--ink);-webkit-text-fill-color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.press{transition:transform .15s ease}
.press:active{transform:scale(.96)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(104px + var(--sb));position:relative}
h1,h2,h3{font-family:var(--serif);color:var(--wine);font-weight:600;line-height:1.1}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 20px 12px}
.sec-h h2{font-size:25px}
.sec-h span{font-size:13px;color:var(--muted)}
.card{background:var(--paper);margin:0 16px;border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
/* ===== HERO ===== */
.hero{background:radial-gradient(ellipse at 85% -10%,#b52828 0%,var(--wine) 42%,var(--dark) 100%);color:#fff;padding:calc(16px + var(--st)) 20px 30px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:320px;height:320px;right:-120px;top:-140px;border-radius:50%;border:1px solid rgba(240,210,122,.18)}
.hero::after{content:"";position:absolute;width:220px;height:220px;left:-90px;bottom:-120px;border-radius:50%;border:1px solid rgba(240,210,122,.14)}
.topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-weight:600;letter-spacing:.16em;color:#f5ead0;font-size:15px}
.brand svg{width:22px;height:22px}
.brand .wm{display:flex;align-items:baseline;gap:6px;letter-spacing:.02em;font-size:21px;color:#fff;font-weight:700}
.brand .wm small{font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;color:var(--gold2);font-weight:400}
.applogo{width:84px;height:84px;margin:0 auto;border-radius:24px;background:radial-gradient(circle at 65% 30%,#b52828,var(--wine) 50%,var(--dark));border:1.5px solid rgba(240,210,122,.55);display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.35);position:relative}
.applogo svg{width:50px;height:50px}
.applogo::after{content:"+";position:absolute;right:-8px;top:-8px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),#d4a63c);color:var(--wine);font-weight:700;font-size:20px;line-height:28px;text-align:center}
.appname{font-family:var(--serif);font-size:58px;font-weight:700;color:#fff;text-align:center;line-height:1;margin-top:16px;position:relative}
.appname span{color:var(--gold2)}
.tagline{text-align:center;color:var(--gold2);font-size:13px;letter-spacing:.06em;margin-top:6px;position:relative}
.avatar{width:36px;height:36px;border-radius:50%;background:rgba(240,210,122,.16);border:1px solid rgba(240,210,122,.45);display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold2);font-size:17px}
.greet{position:relative;z-index:1;margin-top:18px}
.greet small{font-size:13.5px;color:#f3d9d2}
.greet h1{color:#fff;font-size:31px;margin-top:2px}
.ringwrap{position:relative;z-index:1;display:flex;align-items:center;gap:16px;margin-top:16px}
.ring{width:168px;height:168px;flex:none;position:relative}
.ring svg{width:100%;height:100%}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c small{font-size:12px;color:#f3d9d2}
.ring .c b{font-family:var(--serif);font-size:62px;line-height:.85;font-weight:600;color:#fff}
.ring .c i{font-style:normal;font-size:12px;color:var(--gold2);margin-top:4px}
.side{flex:1;display:flex;flex-direction:column;gap:9px}
.mini{background:rgba(255,255,255,.08);border:1px solid rgba(240,210,122,.22);border-radius:16px;padding:9px 12px;display:flex;align-items:center;gap:10px}
.mini .e{font-size:21px;line-height:1}
.mini b{display:block;font-size:17px;font-weight:600;line-height:1.1}
.mini span{font-size:11.5px;color:#f3d9d2}
.phasebar{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:20px}
.ph{font-size:11.5px;color:#f3d9d2}
.ph .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin-bottom:5px}
.ph .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:4px}
.ph.cur{color:var(--gold2);font-weight:500}
.daynav{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.daynav button{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--gold2);padding:6px 4px}
.daynav button:disabled{opacity:.3}
.daynav .today{background:rgba(240,210,122,.16);padding:6px 12px;border-radius:20px}
/* frase */
.quote{margin:-18px 24px 0;position:relative;z-index:2;background:#fff;border-radius:20px;padding:14px 18px 14px 50px;box-shadow:var(--shadow);font-family:var(--serif);font-style:italic;font-size:17.5px;line-height:1.3;color:var(--wine)}
.quote::before{content:"\201C";position:absolute;left:16px;top:2px;font-size:52px;color:var(--gold);font-style:normal}
/* metas do dia */
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.goal{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.goal .gr{width:58px;height:58px;position:relative}
.goal .gr > svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal .gr span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.goal.ok{color:var(--wine);font-weight:600}
.complete{margin-top:14px;border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,var(--gold2),#e3b84f);color:var(--dark);font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
/* cápsula */
.capsbtn{width:100%;display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:22px;background:linear-gradient(135deg,#fffaf0,#fdf1dc);border:1.5px dashed var(--gold);text-align:left;position:relative;overflow:visible}
.capsbtn .cap{width:64px;height:30px;flex:none;position:relative;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.capsbtn b{display:block;font-size:16px;font-weight:600;color:var(--wine)}
.capsbtn small{font-size:12.5px;color:var(--muted);display:block;line-height:1.35}
.capsbtn[aria-pressed=true]{background:linear-gradient(135deg,var(--wine),var(--dark));border:1.5px solid var(--wine)}
.capsbtn[aria-pressed=true] b{color:var(--gold2)}
.capsbtn[aria-pressed=true] small{color:#f3d9d2}
.capsbtn[aria-pressed=true] .cap{transform:rotate(-18deg) scale(1.05)}
.check-badge{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--gold2);color:var(--dark);display:grid;place-items:center;font-weight:700}
/* água */
.waterbox{display:flex;gap:16px;align-items:center}
.bottle{width:74px;flex:none}
.bottle svg{width:100%;height:auto;display:block}
.wave{animation:wave 3s linear infinite}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.wright{flex:1}
.wright .big{font-family:var(--serif);font-size:38px;color:var(--water);font-weight:700;line-height:1}
.wright .big small{font-size:16px;color:var(--muted);font-family:var(--sans);font-weight:400}
.drops{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}
.drop{height:34px;display:grid;place-items:center}
.drop svg{width:22px;height:28px}
.drop path{fill:#fff;stroke:var(--water);stroke-width:1.6;transition:fill .2s}
.drop[aria-pressed=true] path{fill:var(--water)}
.wbtns{display:flex;gap:8px;margin-top:10px}
.wbtns button{flex:1;padding:9px;border-radius:12px;background:#eaf3fa;color:#2f6a96;font-weight:600;font-size:14px}
/* tarefa */
.task{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fdf6ea,#fbecd2);border-radius:22px;padding:16px 18px;margin:0 16px;box-shadow:var(--shadow)}
.task .ti{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;flex:none}
.task p{flex:1;font-size:15px;line-height:1.4}
.tick{width:34px;height:34px;border-radius:11px;border:2px solid var(--gold);flex:none;display:grid;place-items:center;color:transparent;background:#fff;transition:.2s}
.tick[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:var(--gold2)}
/* cardápio */
.meals{display:flex;flex-direction:column;gap:10px;margin:0 16px}
.meal{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%}
.meal .art{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:30px;flex:none;position:relative}
.meal .tx{flex:1;min-width:0}
.meal .tx small{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.meal .tx b{display:block;font-weight:500;font-size:14.5px;line-height:1.3;color:var(--ink)}
.meal .tx b em{font-style:normal;color:var(--wine);font-weight:600}
.meal .go{color:var(--gold);flex:none}
.tag{font-size:10.5px;padding:2px 8px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),#d9ad4a);color:var(--dark);font-weight:600}
/* cores das refeições */
.m-cafe{background:linear-gradient(140deg,#fff3da,#f7d793)}
.m-almoco{background:linear-gradient(140deg,#eef4e2,#bcd39a)}
.m-lanche{background:linear-gradient(140deg,#fff0e3,#f7bd8f)}
.m-jantar{background:linear-gradient(140deg,#f8e8e8,#dca7a7)}
/* receita do dia destaque */
.feature{display:block;width:calc(100% - 32px);margin:0 16px;text-align:left;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
.feature .fa{height:150px;position:relative;display:grid;place-items:center;font-size:84px;overflow:hidden}
.feature .fa::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.35);right:-40px;top:-50px}
.feature .fa::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.25);left:-30px;bottom:-40px}
.feature .fa span{position:relative;z-index:1;filter:drop-shadow(0 8px 12px rgba(42,6,7,.18))}
.feature .fa .fl{position:absolute;left:14px;top:14px;z-index:2;filter:none}
.feature .fb{padding:14px 18px 18px}
.feature .fb strong{display:block;font-family:var(--serif);font-size:26px;color:var(--wine);line-height:1.1;font-weight:600}
.chipsrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chipsrow span{font-size:12px;padding:4px 10px;border-radius:20px;background:#f6efe3;color:var(--ink)}
/* humor */
.moodrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.mood{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;border-radius:16px;background:#f8f1e6;font-size:11px;color:var(--muted)}
.mood span{font-size:26px;line-height:1;filter:grayscale(.5);opacity:.8;transition:.2s}
.mood[aria-pressed=true]{background:var(--wine);color:#fff}
.mood[aria-pressed=true] span{filter:none;opacity:1;transform:scale(1.12)}
textarea,input[type=text],input[type=date],input[type=search],input[inputmode]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;font-size:15px}
textarea{min-height:80px;resize:vertical;margin-top:12px}
textarea:focus,input:focus{outline:none;border-color:var(--gold)}
.cta{display:block;width:100%;text-align:center;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--gold2),#d4a63c);color:var(--dark);font-weight:600;font-size:15.5px;text-decoration:none;box-shadow:0 6px 16px rgba(201,154,46,.3)}
.cta.wine{background:linear-gradient(135deg,var(--wine2),var(--dark));color:#fff;box-shadow:0 6px 16px rgba(122,20,22,.25)}
.cta.soft{background:#f3e9d9;color:var(--wine);box-shadow:none}
.promo{margin:0 16px;border-radius:26px;padding:20px;background:radial-gradient(circle at 90% 10%,#b52828,var(--wine) 50%,var(--dark));color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.promo .pe{position:absolute;right:-6px;top:-8px;font-size:78px;opacity:.9;transform:rotate(12deg)}
.promo b{font-family:var(--serif);font-size:24px;color:var(--gold2);display:block;line-height:1.1;max-width:75%}
.promo p{font-size:13.5px;color:#f3d9d2;margin:6px 0 14px;max-width:80%}
.hint{margin:0 16px;border-radius:22px;padding:16px 18px;background:#fff;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.hint .he{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:var(--rose);flex:none}
.hint b{font-family:var(--serif);font-size:19px;color:var(--wine);display:block;line-height:1.1}
.hint p{font-size:13px;color:var(--muted)}
.hint .cta{width:auto;padding:10px 14px;font-size:13.5px;flex:none}
/* nav */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sb));z-index:20;max-width:456px;margin:0 auto;background:rgba(42,6,7,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:26px;box-shadow:0 10px 30px rgba(42,6,7,.35);padding:6px}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#d8bcb6;border-radius:20px;transition:.2s}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current=page]{color:var(--dark);background:linear-gradient(135deg,var(--gold2),#d9ad4a);font-weight:600}
/* páginas */
.ptop{padding:calc(24px + var(--st)) 20px 4px;position:relative}
.ptop h1{font-size:38px}
.ptop p{color:var(--muted);font-size:14px;margin-top:2px}
.ptop .pe{position:absolute;right:20px;top:calc(18px + var(--st));font-size:44px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:30px;background:#fff;font-size:13.5px;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--wine);color:#fff}
.search{margin:12px 16px 0;position:relative}
.search input{padding-left:42px;border-radius:18px;border:0;box-shadow:var(--shadow)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px 0}
.rc{background:#fff;border-radius:22px;overflow:hidden;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column}
.rc .ra{height:96px;display:grid;place-items:center;font-size:50px;position:relative;overflow:hidden}
.rc .ra::before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.32);right:-30px;top:-40px}
.rc .ra span{position:relative;filter:drop-shadow(0 5px 8px rgba(42,6,7,.15))}
.rc .ra i{position:absolute;left:8px;top:8px;font-style:normal}
.rc .rb{padding:10px 12px 13px}
.rc .rb b{display:block;font-family:var(--serif);font-size:17.5px;line-height:1.12;color:var(--wine);font-weight:600}
.rc .rb small{font-size:11.5px;color:var(--muted);display:block;margin-top:4px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty span{font-size:46px;display:block;margin-bottom:6px}
/* folha */
.sheet-bg{position:fixed;inset:0;background:rgba(42,6,7,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--cream);border-radius:30px 30px 0 0;z-index:41;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:0 0 calc(28px + var(--sb))}
.sheet:not(.open){visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.open{transform:translateY(0);visibility:visible}
.close{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;z-index:3;box-shadow:var(--shadow)}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(42,6,7,.2);position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:3}
.shero{height:200px;display:grid;place-items:center;font-size:100px;position:relative;overflow:hidden}
.shero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.32);right:-70px;top:-90px}
.shero::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.22);left:-40px;bottom:-60px}
.shero span{position:relative;z-index:1;filter:drop-shadow(0 10px 14px rgba(42,6,7,.2))}
.sbody{background:var(--cream);border-radius:28px 28px 0 0;margin-top:-26px;position:relative;padding:22px 20px 0}
.sbody h1{font-size:33px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats3 div{background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.stats3 span{font-size:20px;display:block}
.stats3 b{font-size:13px;font-weight:600;display:block;color:var(--wine)}
.stats3 small{font-size:11px;color:var(--muted)}
.sbody h4{font-family:var(--serif);font-size:22px;color:var(--wine);margin:22px 0 10px}
.ingl button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.ingl button .tick{width:24px;height:24px;border-radius:7px}
.ingl button[aria-pressed=true] span:last-child{text-decoration:line-through;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.step b{width:30px;height:30px;border-radius:50%;background:var(--wine);color:var(--gold2);display:grid;place-items:center;font-family:var(--serif);font-size:17px;flex:none}
.step p{font-size:14.5px;padding-top:3px}
.tipbox{margin-top:18px;border-radius:20px;padding:16px;background:linear-gradient(135deg,#fdf3e1,#f8e3e0);display:flex;gap:12px;font-size:14px}
.tipbox span{font-size:26px}
.tipbox b{color:var(--wine)}
.sheet .plain{padding:calc(56px) 20px 0}
.sheet .plain h1{font-size:34px;margin-bottom:6px}
/* medidas */
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 16px 0}
.mc{background:#fff;border-radius:22px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.mc span{font-size:24px;display:block}
.mc b{display:block;font-family:var(--serif);font-size:29px;color:var(--wine);line-height:1.05;margin-top:4px}
.mc b.down{color:#4d7a2e}
.mc small{font-size:11.5px;color:var(--muted)}
.seg{display:flex;margin:0 16px;background:#f1e5d1;border-radius:16px;padding:4px}
.seg button{flex:1;padding:9px 4px;border-radius:12px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--wine);font-weight:600;box-shadow:0 2px 6px rgba(42,6,7,.1)}
.chart{width:100%;height:auto;display:block}
.mday{display:flex;flex-direction:column;gap:10px;margin:0 16px}
.md{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.md-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.md-h b{font-family:var(--serif);font-size:21px;color:var(--wine)}
.md-h span{font-size:12px;color:var(--muted)}
.md-h .ok{color:#4d7a2e;font-weight:600}
.md-in{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.md-in label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}
.md-in input{text-align:center;padding:11px 6px;font-weight:600}
/* compras */
.prog{margin:12px 16px 0;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.prog .pt{display:flex;justify-content:space-between;font-size:13.5px}
.prog .pt b{color:var(--wine)}
.pbar{height:10px;border-radius:6px;background:#f3eadb;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s}
.group{margin:12px 16px 0;background:#fff;border-radius:22px;padding:14px 16px 6px;box-shadow:var(--shadow)}
.group h3{font-size:21px;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.item:last-child{border-bottom:0}
.item .tick{width:26px;height:26px;border-radius:8px}
.item[aria-pressed=true] span:last-child{text-decoration:line-through;color:var(--muted)}
/* mais */
.badges{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.badge{flex:none;width:104px;background:#fff;border-radius:22px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.badge .bi{width:56px;height:56px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:#f2ebe0;filter:grayscale(1);opacity:.45}
.badge.on .bi{background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold));filter:none;opacity:1;box-shadow:0 4px 12px rgba(201,154,46,.4)}
.badge b{font-size:12px;font-weight:600;display:block;line-height:1.25;color:var(--ink)}
.badge small{font-size:10.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.tile{background:#fff;border-radius:22px;padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:112px;text-decoration:none;color:var(--ink)}
.tile .te{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:23px}
.tile b{font-size:14.5px;font-weight:600;line-height:1.25}
.tile small{font-size:12px;color:var(--muted);line-height:1.3}
.tile.wine{background:linear-gradient(135deg,var(--wine2),var(--dark));color:#fff}
.tile.wine small{color:#f3d9d2}
.pillar{display:flex;gap:14px;background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.pillar .pe2{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;flex:none}
.pillar b{color:var(--wine);font-family:var(--serif);font-size:19px;display:block}
.pillar p{font-size:14px}
.faq{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.faq b{font-family:var(--serif);font-size:18.5px;color:var(--wine);display:block}
.faq p{font-size:14px}
.q{margin-top:16px}
.q label{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--wine)}
/* onboarding */
.onb{min-height:100vh;background:radial-gradient(ellipse at 75% 5%,#b52828,var(--wine) 40%,var(--dark));color:#fff;padding:calc(44px + var(--st)) 26px 40px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.onb::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(240,210,122,.16);right:-200px;top:-140px}
.onb .brand{justify-content:center;font-size:20px;position:relative}
.onb .brand svg{width:34px;height:34px}
.float{position:relative;height:120px;margin-top:10px}
.float span{position:absolute;font-size:44px;animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}
.onb h1{color:#fff;font-size:50px;text-align:center;line-height:.95;position:relative}
.onb h1 em{color:var(--gold2);font-size:64px;display:block}
.feat{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 22px;position:relative}
.feat span{font-size:12.5px;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(240,210,122,.3)}
.onb label{display:block;font-size:13.5px;color:var(--gold2);margin:14px 0 6px;position:relative}
.onb input{background:#fff;border-color:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);position:relative;border-radius:16px;min-height:50px}
.onb input::placeholder{color:#a8958f;-webkit-text-fill-color:#a8958f}
.onb input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
.onb input[type=date]::-webkit-date-and-time-value{text-align:left}
.onb .cta{margin-top:26px;position:relative}
.onb .fine{font-size:12px;color:#d8c2bc;text-align:center;margin-top:14px;position:relative}
/* confete e toast */
.confetti{position:fixed;left:0;top:0;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:60;animation:conf 1.1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{0%{transform:translate(var(--x0),var(--y0)) rotate(0);opacity:1}100%{transform:translate(var(--x1),var(--y1)) rotate(var(--rot));opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%) translateY(20px);background:#fff;color:var(--wine);padding:11px 18px;border-radius:30px;font-size:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:50;white-space:nowrap;box-shadow:0 8px 24px rgba(42,6,7,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.plan{background:rgba(255,255,255,.08);border:1.5px solid rgba(240,210,122,.3);border-radius:20px;padding:12px 10px 12px;text-align:center;color:#fff;position:relative}
.plan .jars{height:44px;display:flex;justify-content:center;align-items:flex-end;gap:2px;margin-bottom:6px}
.plan .jars svg{width:16px;height:30px}
.plan .jars.many svg{width:12px;height:24px}
.plan b{display:block;font-family:var(--serif);font-size:20px;color:var(--gold2);line-height:1.1}
.plan small{font-size:12px;color:#f3d9d2}
.plan[aria-pressed=true]{background:linear-gradient(135deg,var(--gold2),#d4a63c);border-color:var(--gold2)}
.plan[aria-pressed=true] b{color:var(--wine)}
.plan[aria-pressed=true] small{color:var(--dark)}
.other{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;font-size:13px;color:#f3d9d2;position:relative}
.other button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(240,210,122,.5);color:var(--gold2);font-size:18px}
.other b{font-family:var(--serif);font-size:22px;color:#fff;min-width:28px;text-align:center}
.summary{margin-top:14px;background:rgba(0,0,0,.18);border-radius:16px;padding:12px 14px;font-size:13.5px;color:#f3e2dc;text-align:center;position:relative}
.summary b{color:var(--gold2)}
.potbars{position:relative;z-index:1;display:flex;gap:4px;margin-top:20px}
.potbars .pb{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.potbars .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.potleg{position:relative;z-index:1;display:flex;justify-content:space-between;font-size:11.5px;color:#f3d9d2;margin-top:6px}
.potleg b{color:var(--gold2);font-weight:500}
.wnav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.wnav button{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--shadow);color:var(--wine);font-size:18px}
.wnav button:disabled{opacity:.3}
.wnav b{font-family:var(--serif);font-size:22px;color:var(--wine)}
html,body,button,input,textarea{font-variant-numeric:lining-nums proportional-nums;font-feature-settings:"lnum" 1}
h1,h2,h3,.bigday,.appname,.ob-title,b{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.plan .jars{height:50px}
.plan .jars svg{width:24px;height:39px}
.plan .jars.many svg{width:15px;height:25px}

.method .mi{width:46px;height:46px;border-radius:12px;background:rgba(240,210,122,.14);border:1px solid rgba(240,210,122,.35);display:grid;place-items:center;font-size:23px;color:var(--gold2);flex:none}
.method small{display:block;font-size:11.5px;color:var(--gold2)}
.method b{display:block;font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.1}
.method em{display:block;font-style:normal;font-size:12.5px;color:#f0d8d1}
.formula{display:flex;flex-direction:column;border:var(--hair);border-radius:16px;background:#fff;overflow:hidden}
.formula div{padding:12px 14px;border-bottom:var(--hair)}
.formula div:last-child{border-bottom:0}
.formula b{font-family:var(--serif);font-size:18px;color:var(--wine)}
.formula p{font-size:13.5px;color:var(--muted)}
.rtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rtags span{font-size:11.5px;font-weight:600;color:#4c6b33;background:#eef2e6;border:1px solid #dfe7d2;padding:3px 9px;border-radius:6px}

.inst{flex:1;display:flex;flex-direction:column}
.phone{width:196px;height:250px;margin:6px auto 20px;border-radius:30px;background:linear-gradient(180deg,#f3ece1,#e6dccd);border:6px solid #1b0405;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.ph-notch{width:62px;height:14px;border-radius:0 0 10px 10px;background:#1b0405;margin:0 auto}
.ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px;padding:16px 14px 0}
.ph-grid i{display:block;aspect-ratio:1;border-radius:9px;position:relative}
.ph-grid i.me{background:radial-gradient(circle at 65% 30%,#b52828,#7a1416 50%,#2a0607);box-shadow:0 0 0 3px #f0d27a,0 6px 14px rgba(122,20,22,.45);animation:pop .7s cubic-bezier(.3,1.6,.5,1) .3s both;z-index:1}
.ph-grid i.me span{position:absolute;inset:18%}
.ph-grid i.me span svg{width:100%;height:100%}
.ph-grid i.me em{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);font-style:normal;font-size:8.5px;font-weight:700;color:#3b2a2a;white-space:nowrap}
.ph-dock{position:absolute;left:10px;right:10px;bottom:10px;height:44px;border-radius:16px;background:rgba(255,255,255,.55);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:7px 12px}
.ph-dock i{border-radius:8px;background:#d3cbbf}
.isteps{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.isteps.alt{margin-top:14px}
.isteps div{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(240,210,122,.22)}
.isteps b{width:26px;height:26px;border-radius:50%;background:var(--gold2);color:var(--wine);display:grid;place-items:center;font-size:13px;flex:none}
.isteps p{font-size:14px;line-height:1.45;color:#f6e6e1}
.isteps strong{color:#fff;font-weight:700}
.kbd{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#fff;color:#1f6fd1;font-size:16px;vertical-align:middle;margin-left:2px}
.ios-hint{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:14px;color:var(--gold2);font-size:12px;animation:bob 1.6s ease-in-out infinite}
.ios-hint .i{font-size:22px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.inst .skip{margin-top:auto;padding:16px 10px 4px;color:#f0d8d1;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.inst-ok{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px;border-radius:14px;background:rgba(240,210,122,.16);color:var(--gold2);font-weight:600}
.inst-note{text-align:center;color:#f0d8d1;font-size:14px}
.inst.light .isteps div{background:#fff;border:var(--hair)}
.inst.light .isteps p{color:var(--ink)}
.inst.light .isteps strong{color:var(--wine)}
.inst.light .isteps b{background:var(--wine);color:var(--gold2)}
.inst.light .inst-ok{background:#f3e7d1;color:var(--wine)}
.inst.light .inst-note{color:var(--muted)}
.inst.light .ios-hint{color:var(--gold)}
.inst.light .phone{margin-top:0}
.instbar{margin:14px 16px 0;display:flex;align-items:center;gap:12px;background:#fff;border:var(--hair);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:var(--shadow);position:relative}
.instbar .ib-ic{width:42px;height:42px;border-radius:11px;background:radial-gradient(circle at 65% 30%,#b52828,#7a1416 50%,#2a0607);display:grid;place-items:center;flex:none}
.instbar .ib-ic svg{width:24px;height:24px}
.instbar div{flex:1;min-width:0}
.instbar b{display:block;font-size:14px;color:var(--wine)}
.instbar small{font-size:12px;color:var(--muted)}
.instbar .cta{width:auto;padding:9px 14px;font-size:13.5px}
.instbar .ib-x{position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:#fff;border:var(--hair);color:var(--muted);font-size:11px;box-shadow:var(--shadow)}
</style>

/* ===== armazenamento ===== */
let S = load();
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); o.days=o.days||{}; o.meas=o.meas||{}; o.checkins=o.checkins||{}; o.shop=o.shop||{}; return o; } }catch(e){} return {start:null,name:"",days:{},meas:{},checkins:{},shop:{}}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function dayData(n){ return S.days[n] || (S.days[n]={caps:false,task:false,water:0,crave:null,note:""}); }

/* ===== datas ===== */
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function currentDay(){ if(!S.start) return 0; return Math.round((parseISO(iso(new Date()))-parseISO(S.start))/864e5)+1; }
function totalDays(){ return (S.potes||1)*DIAS_POTE; }
function menuDay(n){ return ((n-1)%21)+1; }
function taskOf(n){ return n<=21 ? DATA.days[n-1].task : MAINT[(n-22)%MAINT.length]; }
function phaseOf(n){ if(n<=7) return {name:"Adaptação",lab:"Fase 1"}; if(n<=14) return {name:"Ritmo",lab:"Fase 2"}; if(n<=21) return {name:"Consolidação",lab:"Fase 3"}; return {name:"Manutenção",lab:"Mês "+Math.ceil(n/30)}; }
function poteOf(n){ return Math.max(1,Math.ceil(n/DIAS_POTE)); }
function measDays(){ const s=new Set([0,7,14,21]); for(let k=1;k<=(S.potes||1);k++) s.add(k*DIAS_POTE); return [...s].sort((a,b)=>a-b); }
function capsLeft(){ return Math.max(0,(S.potes||1)*CAPS_POTE - takenCount()*CAPS_DIA); }
function activeDay(){ return viewDay ?? Math.max(1,Math.min(currentDay(),totalDays())); }
function greeting(){ const h=new Date().getHours(); return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"; }

/* ===== utilidades ===== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const RNAMES=DATA.recipes.map((r,i)=>({n:r.name,i})).sort((a,b)=>b.n.length-a.n.length);
function findRecipe(text){ const t=text.toLowerCase(); return RNAMES.find(x=>t.includes(x.n.toLowerCase())); }

  for(let i=0;i<N;i++){ const a0=i*seg+gap/2, a1=(i+1)*seg-gap/2; const [x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r); const k=base+i+1, on=S.days[k]?.caps;
    const col = on ? "url(#rg)" : (k===n ? "#ffffff" : "rgba(255,255,255,.18)");
    out+=`<path d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" stroke="${col}" stroke-width="${k===n?11:8}" stroke-linecap="round" fill="none"/>`; }

function num(v){ const x=parseFloat(String(v??"").replace(",",".")); return isNaN(x)?null:x; }
function medidas(){
  const unit=measMetric==="peso"?"kg":"cm";
  const MD=measDays(); const pts=MD.map(d=>({d,v:num(S.meas[d]?.[measMetric])})).filter(p=>p.v!==null);
  const cards=[["peso","§scale§","kg"],["cintura","§ruler§","cm"],["quadril","§tape§","cm"]].map(([k,e,u])=>{ const a=num(S.meas[0]?.[k]); const last=[...MD].reverse().filter(d=>d>0).map(d=>num(S.meas[d]?.[k])).find(v=>v!==null); if(a===null||last===null) return `<div class="mc"><span>${e}</span><b>–</b><small>${k} (${u})</small></div>`; const df=last-a; return `<div class="mc"><span>${e}</span><b class="${df<0?"down":""}">${df>0?"+":""}${df.toFixed(1).replace(".",",")}</b><small>${k} (${u})</small></div>`; }).join("");
  const days=MD.map(d=>{ const m=S.meas[d]||{}; const full=["peso","cintura","quadril"].every(k=>num(m[k])!==null); return `<div class="md"><div class="md-h"><b>Dia ${d}</b>${full?'<span class="ok">✓ registrado</span>':`<span>${d===0?"antes de começar":d%30===0?"fim do pote "+d/30:"fim da semana "+d/7}</span>`}</div><div class="md-in">${[["peso","Peso (kg)"],["cintura","Cintura (cm)"],["quadril","Quadril (cm)"]].map(([k,l])=>`<div><label for="m${d}${k}">${l}</label><input id="m${d}${k}" inputmode="decimal" data-meas="${d}" data-k="${k}" value="${esc(m[k]??"")}" placeholder="–"></div>`).join("")}</div></div>`; }).join("");
  return `<div class="ptop"><h1>Evolução</h1><p>Relatório do seu tratamento, atualizado a cada registro.</p><span class="pe">§chart§</span></div>
  <div class="sec-h" style="margin-top:14px"><h2>Relatório</h2><span>dia ${Math.max(elapsedDays(),0)} de ${totalDays()}</span></div>
  ${report()}
  <div class="sec-h"><h2>Medidas</h2><span>dia 0 até hoje</span></div>
  <div class="mcards" style="margin-top:0">${cards}</div>
  <div class="sec-h"><h2>Evolução</h2></div>
  <div class="seg">${[["cintura","Cintura"],["quadril","Quadril"],["peso","Peso"]].map(([k,l])=>`<button data-metric="${k}" aria-pressed="${measMetric===k}">${l}</button>`).join("")}</div>
  <div class="card" style="margin-top:12px">${chart(pts,unit)}</div>
  <div class="sec-h"><h2>Registros</h2><span>sempre pela manhã</span></div>
  <div class="mday">${days}</div>`;
}
function chart(pts,unit){
  const W=320,H=190,L=34,Rr=18,T=30,B=28;
  if(pts.length<2) return `<div class="empty" style="padding:26px 0"><span>§chart§</span>Registre pelo menos duas medidas para ver o gráfico.</div>`;
  const vs=pts.map(p=>p.v); let mn=Math.min(...vs),mx=Math.max(...vs); if(mx-mn<2){mn-=1;mx+=1;}
  const XM=Math.max(21,...pts.map(p=>p.d)); const x=d=>L+(d/XM)*(W-L-Rr), y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const line=pts.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=line+` L${x(pts[pts.length-1].d).toFixed(1)} ${H-B} L${x(pts[0].d).toFixed(1)} ${H-B} Z`;
  const grid=[mn,(mn+mx)/2,mx].map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#efe2cc" stroke-dasharray="3 4"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8a7570">${v.toFixed(0)}</text>`).join("");
  const xl=pts.map(p=>p.d).map(d=>`<text x="${x(d)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#8a7570">Dia ${d}</text>`).join("");
  const dots=pts.map(p=>`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="6" fill="#fff" stroke="#7a1416" stroke-width="3"/><g><rect x="${x(p.d)-19}" y="${y(p.v)-30}" width="38" height="19" rx="9.5" fill="#7a1416"/><text x="${x(p.d)}" y="${y(p.v)-16.5}" text-anchor="middle" font-size="11" font-weight="600" fill="#f0d27a">${String(p.v).replace(".",",")}</text></g>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução em ${unit}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d27a" stop-opacity=".55"/><stop offset="1" stop-color="#f0d27a" stop-opacity="0"/></linearGradient></defs>${grid}${xl}<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="#c99a2e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}

/* ===== AUTORIDADE: dados do tratamento ===== */
function elapsedDays(){ return Math.min(Math.max(currentDay(),0),totalDays()); }
function adherence(){ const e=elapsedDays(); if(e<1) return null; const den = S.days[e]?.caps ? e : e-1; if(den<1) return S.days[e]?.caps?100:null; let c=0; for(let i=1;i<=den;i++) if(S.days[i]?.caps) c++; return Math.round(c/den*100); }
function avgOf(key,from,to){ const v=[]; for(let i=from;i<=to;i++){ const x=S.days[i]?.[key]; if(x!==null&&x!==undefined&&!(key==="water"&&!S.days[i])) v.push(x); } return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; }
function planId(){ if(!S.planId){ let h=0; const s=(S.name||"")+S.start+S.potes; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; S.planId=String(S.start||"").slice(2,4)+String(S.start||"").slice(5,7)+"-"+String(1000+h%9000); save(); } return S.planId; }
function recipeTags(r){ const t=norm(r.ing.join(" ")+" "+r.name), out=[];
  if(/frango|ovo|peixe|tilapia|atum|carne|iogurte|queijo|sobrecoxa|musculo|acem/.test(t)) out.push("Com proteína");
  if(/aveia|grao-de-bico|lentilha|feijao|abobora|espinafre|couve|brocolis|abobrinha|cenoura|chuchu|berinjela|alface|psyllium|legumes/.test(t)) out.push("Com fibras");
  if(r.tags.includes("jantar")) out.push("Leve para a noite");
  if(/^(5|10|15|20) min/.test(r.time)) out.push("Preparo rápido");
  return out; }
function trust(){ return `<div class="trust"><div class="tr-row"><span>§shield§</span><p><b>Secalyn</b> é suplemento alimentar com notificação ativa na ANVISA.</p></div><div class="tr-row"><span>§layers§</span><p>Rotina baseada no <b>Método Seca</b>: cápsulas, hidratação, prato leve e movimento.</p></div><small>${APP_NAME} · desenvolvido pela equipe Secalyn · Plano nº ${planId()}</small></div>`; }
function report(){
  const e=elapsedDays(), adh=adherence(), wat=avgOf("water",1,Math.max(e,1)), full=Object.entries(S.days).filter(([k,x])=>+k<=e&&x.caps&&x.task&&x.water>=8).length;
  const c0=avgOf("crave",1,Math.min(7,e)), c1=e>7?avgOf("crave",Math.max(1,e-6),e):null;
  const f=v=>v===null?"–":v.toFixed(1).replace(".",",");
  return `<div class="rep">
   <div><small>Adesão ao Secalyn</small><b>${adh===null?"–":adh+"%"}</b><span>dos dias até hoje</span></div>
   <div><small>Hidratação média</small><b>${f(wat)}</b><span>copos por dia</span></div>
   <div><small>Dias completos</small><b>${full}</b><span>com as 3 metas</span></div>
   <div><small>Vontade de beliscar</small><b>${c1!==null&&c0!==null?f(c0)+" → "+f(c1):f(c0)}</b><span>${c1!==null?"1ª semana → últimos 7 dias":"média de 0 a 10"}</span></div></div>`;
}

/* ===== COMPRAR ===== */
function brl(v){ return "R$ "+v.toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,"."); }
function daysRemaining(){ const T=totalDays(), c=currentDay(); return c<1?T:Math.max(0,T-c+1); }
function updateDot(){ const d=$("#buydot"); if(d) d.hidden=!(S.potes && daysRemaining()<=PRAZO_ENTREGA); }
function comprar(){
  const T=totalDays(), rem=daysRemaining(), fim=addDays(S.start,T-1), pedir=addDays(fim,-PRAZO_ENTREGA), over=currentDay()>T;
  const pct=Math.min(100,Math.round((T-rem)/T*100)), single=KITS[0].preco/KITS[0].potes;
  const bestPer=Math.min(...KITS.map(k=>k.preco/k.potes));
  const msg = over ? `<div class="bh-msg urg">Seu tratamento terminou em ${fmtDate(fim)}. Garanta seus potes para retomar a rotina.</div>`
    : rem<=PRAZO_ENTREGA ? `<div class="bh-msg urg">Peça agora: considerando a entrega, este é o momento ideal para não ficar sem.</div>`
    : `<div class="bh-msg">Para não interromper, faça seu pedido até <b style="color:var(--gold2)">${fmtDate(pedir)}</b>, já contando o prazo de entrega.</div>`;
  const kits=KITS.map(k=>{ const per=k.preco/k.potes, eco=single*k.potes-k.preco, many=k.potes>4;
    const flag = k.potes===S.potes ? `<span class="flag mine">Seu plano atual</span>` : (per===bestPer && k.potes>1 ? `<span class="flag">Menor preço por pote</span>` : "");
    return `<div class="kit ${per===bestPer&&k.potes>1?"best":""}">${flag}<div class="kit-top"><div class="kit-art ${many?"many":""}">${JAR.repeat(Math.min(k.potes,8))}</div><div class="kit-tx"><b>${esc(k.nome)}</b><small>+${k.potes*DIAS_POTE} dias de tratamento · ${k.potes} pote${k.potes>1?"s":""}</small></div></div>
    <div class="kit-price"><div class="pp"><b>${esc(k.parcela)}</b><small>ou ${brl(k.preco)} à vista · ${brl(per)} por pote</small></div>${eco>0?`<span class="eco">economize ${brl(eco)}</span>`:""}</div>
    <a class="cta ${per===bestPer&&k.potes>1?"":"wine"} press" href="${esc(k.url)}" target="_blank" rel="noopener" data-buy="${k.potes}">Comprar ${k.potes} pote${k.potes>1?"s":""}</a></div>`; }).join("");
  return `<div class="ptop"><h1>Comprar</h1><p>Continue seu tratamento sem interrupção.</p><span class="pe">§jar§</span></div>
  <div class="bhero"><div class="bh-top"><div class="bh-num">${over?0:rem}<small>dia${rem===1?"":"s"} de tratamento restante${rem===1?"":"s"}</small></div>
  <div class="bh-side"><span>§capsule§ <b>${capsLeft()}</b> cápsulas restantes</span><span>§calendar§ Termina em <b>${fmtDate(fim)}</b></span><span>§jar§ Plano de <b>${S.potes} pote${S.potes>1?"s":""}</b></span></div></div>
  <div class="bh-bar"><i style="width:${pct}%"></i></div>${msg}</div>
  ${CUPOM?`<div class="coupon"><span style="font-size:26px">§gift§</span><div><small>Cupom de cliente Seca+</small><b>${esc(CUPOM)}</b></div><button class="press" data-copy="${esc(CUPOM)}">Copiar</button></div>`:""}
  <div class="sec-h"><h2>Escolha seu kit</h2><span>pagamento seguro</span></div>
  <div class="kits">${kits}</div>
  <div style="height:14px"></div>
  <div class="perks"><div><span>§truck§</span>Frete grátis para todo o Brasil</div><div><span>§card§</span>Pix, cartão em até 12x ou boleto</div><div><span>§phone§</span>Seu progresso continua no app</div></div>
  <div class="sec-h"><h2>Já comprou?</h2></div>
  <div class="hint"><span class="he">§plus§</span><div style="flex:1"><b>Adicione ao seu plano</b><p>Some os novos potes e o app estende o seu tratamento.</p></div><button class="cta wine press" data-sub="addplano">Adicionar</button></div>
  <div style="height:10px"></div>`;
}

/* ===== MAIS ===== */
function badges(){
  const d=S.days, T=totalDays(), tk=takenCount();
  let maxRun=0,run=0; for(let i=1;i<=T;i++){ if(d[i]?.caps){run++;maxRun=Math.max(maxRun,run);} else run=0; }
  const hyd=Object.values(d).filter(x=>x.water>=8).length, full=Object.values(d).filter(x=>x.caps&&x.task&&x.water>=8).length;
  const nMeas=measDays().filter(k=>num(S.meas[k]?.cintura)!==null).length;
  const list=[
    {e:"§sprout§",t:"Primeiro dia",s:"1º dia com Secalyn",on:tk>=1},
    {e:"§flame§",t:"Sequência",s:"3 dias seguidos",on:maxRun>=3},
    {e:"§drop§",t:"Hidratação",s:"meta de água 5 vezes",on:hyd>=5},
    {e:"",t:"Dia completo",s:"3 metas no mesmo dia",on:full>=1},
    {e:"§star§",t:"Uma semana",s:"7 dias seguidos",on:maxRun>=7},
    {e:"§compass§",t:"21 dias",s:"primeiras 3 semanas",on:tk>=21},
    {e:"§ruler§",t:"Evolução",s:"2 medidas registradas",on:nMeas>=2},
    {e:"§note§",t:"Primeiro check-in",s:"1 check-in feito",on:Object.keys(S.checkins).length>0},
    {e:"§jar§",t:"1º pote",s:"concluído",on:tk>=30}];
  if(T>=90) list.push({e:"§half§",t:"Metade",s:"metade do tratamento",on:tk>=T/2});
  list.push({e:"§award§",t:"Tratamento completo",s:T+" dias com Secalyn",on:tk>=T});
  return list;
}
function mais(){
  const b=badges(), on=b.filter(x=>x.on).length;
  return `<div class="ptop"><h1>Mais</h1><p>Marcos, guias e ajustes.</p><span class="pe">§leaf§</span></div>
  <button class="method press" data-sub="metodo"><span class="mi">§layers§</span><span><small>Conheça a base da sua rotina</small><b>Método Seca</b><em>Os 4 pilares, a fórmula e a qualidade do Secalyn</em></span></button>
  <div class="sec-h" style="margin-top:14px"><h2>Marcos</h2><span>${on} de ${b.length}</span></div>
  <div class="badges">${b.map(x=>`<div class="badge ${x.on?"on":""}"><div class="bi">${x.e}</div><b>${x.t}</b><small>${x.s}</small></div>`).join("")}</div>
  <div class="sec-h"><h2>Guias</h2></div>
  <div class="tiles">
   <button class="tile press" data-sub="checkin"><span class="te m-jantar">§note§</span><b>Check-ins semanais</b><small>Olhe para trás e planeje</small></button>
   <button class="tile press" data-sub="pilares"><span class="te m-almoco">§leaf§</span><b>Os 4 pilares</b><small>A base da rotina</small></button>
   <button class="tile press" data-sub="faq"><span class="te m-cafe">§chat§</span><b>Dúvidas</b><small>Perguntas frequentes</small></button>
   <button class="tile press" data-sub="instalar"><span class="te m-lanche">§phone§</span><b>Tela inicial</b><small>Use como aplicativo</small></button>
   <button class="tile wine press" data-goto="comprar"><span class="te" style="background:rgba(255,255,255,.12)">§capsule§</span><b>Comprar Secalyn</b><small>Garanta seu próximo pote</small></button>
   <button class="tile press" data-sub="suporte"><span class="te m-cafe">§mail§</span><b>Suporte</b><small>Fale com a gente</small></button>
  </div>
  <div class="sec-h"><h2>Ajustes</h2></div>
  <div class="tiles"><button class="tile press" data-sub="plano"><span class="te m-cafe">§jar§</span><b>Meu plano</b><small>${S.potes} pote${S.potes>1?"s":""} · ${totalDays()} dias</small></button><button class="tile press" data-sub="inicio"><span class="te m-almoco">§calendar§</span><b>Data de início</b><small>Mudar ou recomeçar</small></button><button class="tile press" data-sub="apagar"><span class="te m-jantar">§trash§</span><b>Apagar dados</b><small>Limpar este celular</small></button></div>
  <p class="muted" style="text-align:center;font-size:12px;margin:22px 24px"><b style="font-family:var(--serif);font-size:16px;color:var(--wine)">${APP_NAME}</b> by Secalyn<br>Este app é educativo e não substitui o acompanhamento de um profissional de saúde. Use o Secalyn conforme o rótulo.</p>`;
}
function plain(title,html){ openSheet(`<div class="plain"><h1 id="sheettitle">${title}</h1>${html}</div>`); }
function openSub(k){
  if(k==="checkin") return openCheckin(Math.max(1,Math.ceil(Math.min(Math.max(currentDay(),1),totalDays())/7)));
  if(k==="plano"){ closeSheet(); editingPlan=true; obStart(2); render(); window.scrollTo(0,0); return; }
  if(k==="addplano"){ closeSheet(); editingPlan="add"; obStart(2); OB.potes=null; render(); window.scrollTo(0,0); return; }
  if(k==="metodo"){ const F=[["Psyllium","Fibra natural que, em contato com a água, forma um gel. Contribui para a sensação de saciedade."],["Cromo","Mineral que participa do metabolismo dos carboidratos."],["Laranja Moro","Laranja vermelha da Sicília, rica em antocianinas."],["Espirulina","Microalga rica em proteínas e nutrientes."],["Taurina","Aminoácido presente naturalmente no organismo."]];
    return plain("Método Seca",`<p class="muted" style="margin-bottom:16px">O ${APP_NAME} organiza o seu dia em torno de quatro pilares. O primeiro é o Secalyn; os outros três ajudam você a aproveitá-lo.</p>
    ${PILARES.map((p,i)=>`<div class="pillar"><span class="pe2 ${p[3]}">${p[0]}</span><div><b>${i+1}. ${p[1]}</b><p>${p[2]}</p></div></div>`).join("")}
    <h4 style="font-family:var(--serif);font-size:22px;color:var(--wine);margin:22px 0 10px">A fórmula</h4>
    <div class="formula">${F.map(f=>`<div><b>${f[0]}</b><p>${f[1]}</p></div>`).join("")}</div>
    <h4 style="font-family:var(--serif);font-size:22px;color:var(--wine);margin:22px 0 10px">Qualidade</h4>
    <div class="pillar"><span class="pe2 m-almoco">§shield§</span><div><b>Notificação ativa na ANVISA</b><p>O Secalyn é um suplemento alimentar com notificação ativa na Agência Nacional de Vigilância Sanitária. A situação pode ser conferida na consulta pública oficial.</p></div></div>
    <p class="muted" style="font-size:12.5px;margin-top:8px">Consulte sempre o rótulo para a composição completa e o modo de uso. Este app é educativo e não substitui o acompanhamento de um profissional de saúde.</p>`); }
  if(k==="pilares") return plain("Os 4 pilares",`<p class="muted" style="margin-bottom:14px">O primeiro é o Secalyn. Os outros três ajudam você a aproveitá-lo.</p>${PILARES.map(p=>`<div class="pillar"><span class="pe2 ${p[3]}">${p[0]}</span><div><b>${p[1]}</b><p>${p[2]}</p></div></div>`).join("")}`);
  if(k==="faq") return plain("Dúvidas",`<div style="margin-top:12px">${FAQ.map(f=>`<div class="faq"><b>${f[0]}</b><p>${f[1]}</p></div>`).join("")}</div>`);
  if(k==="instalar") return plain("Na tela inicial",`<p class="muted" style="margin:4px 0 14px">Tenha o ${APP_NAME} junto com os seus apps e abra sua rotina com um toque.</p><div class="inst light">${phoneMock()}${installSteps()}</div>`);
  if(k==="suporte") return plain("Suporte",`<p style="margin:10px 0 16px">Ficou com alguma dúvida sobre o app ou o seu pedido? Fale com a gente:</p><a class="cta wine" href="mailto:${SUPORTE}">${SUPORTE}</a>`);
  if(k==="inicio"){ plain("Data de início",`<p style="margin:10px 0 14px">Mude a data se você começou em outro dia ou quer recomeçar. Suas marcações e medidas continuam salvas.</p><input type="date" id="newstart" value="${S.start}"><button class="cta wine press" style="margin-top:14px" id="savestart">Salvar data</button>`); $("#savestart").onclick=()=>{ const v=$("#newstart").value; if(v){ S.start=v; save(); viewDay=null; closeSheet(); render(true); toast("Data de início salva"); } }; return; }
  if(k==="apagar"){ plain("Apagar dados",`<p style="margin:10px 0 16px">Isso apaga sua data de início, marcações, medidas, check-ins e listas deste celular. Não dá para desfazer.</p><button class="cta wine" id="wipe">Apagar tudo</button>`); $("#wipe").onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} S=load(); OB=null; closeSheet(); tab="hoje"; render(true); }; return; }
}
function openCheckin(w){
  const W=Math.ceil(totalDays()/7); w=Math.max(1,Math.min(W,w));
  const a=S.checkins[w]||[], days=[1,2,3,4,5,6,7].map(i=>(w-1)*7+i);
  const caps=days.filter(d=>S.days[d]?.caps).length, wat=days.filter(d=>(S.days[d]?.water||0)>=8).length;
  const cr=days.map(d=>S.days[d]?.crave).filter(v=>v!==null&&v!==undefined); const avg=cr.length?(cr.reduce((x,y)=>x+y,0)/cr.length):null;
  const face=avg===null?"–":avg<2?"§dot1§":avg<4?"§dot2§":avg<6?"§dot3§":avg<8?"§dot4§":"§dot5§";
  plain("Check-in",`<div class="wnav"><button data-ciw="${w-1}" ${w<=1?"disabled":""} aria-label="Semana anterior">‹</button><b>Semana ${w} de ${W}</b><button data-ciw="${w+1}" ${w>=W?"disabled":""} aria-label="Próxima semana">›</button></div>
  <div class="stats3"><div><span>§capsule§</span><b>${caps}/7</b><small>com Secalyn</small></div><div><span>§drop§</span><b>${wat}/7</b><small>meta de água</small></div><div><span>${face}</span><b>vontade</b><small>média da semana</small></div></div>
  ${CHECKIN_Q.map((q,i)=>`<div class="q"><label for="ci${i}">${q}</label><textarea id="ci${i}">${esc(a[i]||"")}</textarea></div>`).join("")}
  <button class="cta wine press" style="margin-top:16px" id="cisave">Salvar check-in</button>`);
  $("#cisave").onclick=()=>{ S.checkins[w]=CHECKIN_Q.map((_,i)=>$("#ci"+i).value); save(); toast("Check-in salvo"); closeSheet(); if(tab==="mais") render(); };
}

/* ===== folha ===== */
let lastFocus=null;
function openSheet(html){ lastFocus=document.activeElement; const s=$("#sheet"); s.innerHTML=ico(`<span class="grab"></span><button class="close" data-close aria-label="Fechar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg></button>${html}`); s.scrollTop=0; s.classList.add("open"); $("#sheetbg").classList.add("open"); document.body.style.overflow="hidden"; setTimeout(()=>{ const c=$(".close",s); c&&c.focus({preventScroll:true}); },60); }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#sheetbg").classList.remove("open"); document.body.style.overflow=""; if(lastFocus) try{lastFocus.focus({preventScroll:true});}catch(e){} }

/* ===== eventos ===== */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-goto]"); if(!t||t.disabled) return; const ds=t.dataset;
  if(ds.tab){ tab=ds.tab; if(tab==="hoje") viewDay=null; render(true); window.scrollTo(0,0); return; }
  if(ds.close!==undefined){ closeSheet(); return; }
  if(ds.recipe!==undefined){ openRecipe(+ds.recipe); return; }
  if(ds.ing!==undefined){ t.setAttribute("aria-pressed", t.getAttribute("aria-pressed")!=="true"); return; }
  if(ds.obnext!==undefined){ if(OB.name.trim()) obGo(2); return; }
  if(ds.obback!==undefined){ if(editingPlan){ const back=editingPlan==="add"?"comprar":"mais"; editingPlan=false; OB=null; tab=back; render(true); } else obGo(OB.step-1); return; }
  if(ds.plan){ const p=+ds.plan; OB.potes=p; if(editingPlan==="add"){ obPick(t,()=>{ S.potes=(S.potes||0)+p; save(); editingPlan=false; OB=null; tab="hoje"; viewDay=null; render(true); window.scrollTo(0,0); toast("+"+p+" pote"+(p>1?"s":"")+": "+totalDays()+" dias de tratamento"); setTimeout(()=>confetti($(".ring")||document.body),200); }); }
    else if(editingPlan){ obPick(t,()=>{ S.potes=p; save(); editingPlan=false; OB=null; tab="mais"; render(true); toast("Plano atualizado: "+p+" pote"+(p>1?"s":"")); }); } else obPick(t,()=>obGo(3)); return; }
  if(ds.other){ obOther=Math.max(1,Math.min(24,obOther+(+ds.other))); const b=$(".other b"); if(b) b.textContent=obOther; const u=$(".other .use"); if(u) u.dataset.plan=obOther; vibrate(); return; }
  if(ds.start){ OB.start=ds.start; OB.startMode=ds.mode; obPick(t,()=>obGo(4)); return; }
  if(ds.startother!==undefined){ OB.startMode="outro"; render(); setTimeout(()=>{ const d=$("#obdate"); d&&d.scrollIntoView({behavior:"smooth",block:"center"}); },50); return; }
  if(ds.obdate!==undefined){ OB.start=$("#obdate").value||iso(new Date()); obGo(4); return; }
  if(ds.desafio){ OB.desafio=ds.desafio; obPick(t,()=>obGo(5)); return; }
  if(ds.horario){ OB.horario=ds.horario; obPick(t,()=>obGo(6)); return; }
  if(ds.obfinish!==undefined){ obFinish(); return; }
  if(ds.obinstall!==undefined){ obGo(8); return; }
  if(ds.install!==undefined){ doInstall(); return; }
  if(ds.insthide!==undefined){ S.instHide=true; save(); render(); return; }
  if(ds.copylink!==undefined){ try{ navigator.clipboard.writeText(location.href.split("#")[0]); toast("Link copiado. Cole no navegador."); }catch(e){ toast(location.href); } return; }
  if(ds.nav){ viewDay=Math.max(1,Math.min(totalDays(),activeDay()+(+ds.nav))); if(viewDay===Math.min(currentDay(),totalDays())) viewDay=null; render(true); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(ds.today!==undefined){ viewDay=null; render(true); return; }
  if(ds.review!==undefined){ viewDay=totalDays(); render(true); window.scrollTo(0,0); return; }
  if(ds.caps!==undefined){ const n=activeDay(), d=dayData(n); d.caps=!d.caps; save(); vibrate(d.caps?30:10); const y=window.scrollY; render(); window.scrollTo(0,y); if(d.caps){ confetti($("[data-caps]")); toast("Cápsulas do dia "+n+" registradas"); checkComplete(d); } return; }
  if(ds.water||ds.wadd){ const n=activeDay(), d=dayData(n); const before=d.water; if(ds.water){ const v=+ds.water; d.water=(d.water===v)?v-1:v; } else d.water=Math.max(0,Math.min(8,d.water+(+ds.wadd))); save(); vibrate(); const y=window.scrollY; render(); window.scrollTo(0,y); if(d.water===8&&before<8){ toast("Meta de água concluída"); checkComplete(d); } return; }
  if(ds.task!==undefined){ const n=activeDay(), d=dayData(n); d.task=!d.task; save(); vibrate(); const y=window.scrollY; render(); window.scrollTo(0,y); if(d.task){ toast("Tarefa concluída"); checkComplete(d); } return; }
  if(ds.crave!==undefined){ const n=activeDay(), d=dayData(n); d.crave=+ds.crave; save(); document.querySelectorAll("[data-crave]").forEach(b=>b.setAttribute("aria-pressed",b===t)); vibrate(); return; }
  if(ds.goto){ if(ds.goto==="compras"){ tab="receitas"; recView="mercado"; } else tab=ds.goto; render(true); window.scrollTo(0,0); return; }
  if(ds.recview){ recView=ds.recview; render(); return; }
  if(ds.copy){ try{ navigator.clipboard.writeText(ds.copy); toast("Cupom copiado"); }catch(e){ toast("Cupom: "+ds.copy); } return; }
  if(ds.checkin){ openCheckin(+ds.checkin); return; }
  if(ds.ciw){ openCheckin(+ds.ciw); return; }
  if(ds.filter){ recFilter=ds.filter; render(); return; }
  if(ds.metric){ measMetric=ds.metric; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(ds.week){ shopWeek=ds.week; render(); return; }
  if(ds.shop){ S.shop[ds.shop]=!S.shop[ds.shop]; save(); vibrate(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(ds.clearshop!==undefined){ Object.keys(S.shop).forEach(k=>{ if(k.startsWith(shopWeek+"|")) delete S.shop[k]; }); save(); render(); return; }
  if(ds.sub){ openSub(ds.sub); return; }
});
function checkComplete(d){ if(d.caps&&d.task&&d.water>=8){ setTimeout(()=>{ toast("Dia completo"); confetti($(".goals")||document.body); vibrate(40); },500); } }
$("#sheetbg").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#sheet").classList.contains("open")) closeSheet(); });
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="note"){ dayData(activeDay()).note=t.value; save(); }
  if(t.id==="rq"){ recQuery=t.value; const p=t.selectionStart; render(); const r=$("#rq"); r.focus(); try{r.setSelectionRange(p,p);}catch(_){} }
  if(t.dataset.meas!==undefined){ const d=t.dataset.meas; S.meas[d]=S.meas[d]||{}; S.meas[d][t.dataset.k]=t.value; save(); }
});
document.addEventListener("change",e=>{ if(e.target.dataset.meas!==undefined&&tab==="medidas"){ const y=window.scrollY, id=document.activeElement&&document.activeElement.id; render(); window.scrollTo(0,y); } });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&tab==="hoje"&&viewDay===null&&!$("#sheet").classList.contains("open")) render(); });
render(true);
</script>
