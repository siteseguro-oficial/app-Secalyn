<title>Secalyn · Protocolo Seca 21 Dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#7a1416;--wine2:#9c1f1f;--dark:#2a0607;--gold:#c99a2e;--gold2:#f0d27a;
  --cream:#fbf6ec;--paper:#ffffff;--rose:#f5e6e1;--ink:#3b2a2a;--muted:#7d6a66;--line:#ead9bd;--water:#5b93bd;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Poppins",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:var(--ink);-webkit-text-fill-color:var(--ink)}
:root{color-scheme:light}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + var(--safe-b));position:relative}
h1,h2,h3{font-family:var(--serif);color:var(--wine);font-weight:600;line-height:1.1}
h2{font-size:24px;margin:28px 20px 12px}
.pad{padding:0 20px}
.muted{color:var(--muted)}
/* topo */
.hero{background:radial-gradient(ellipse at 80% 0%,#a32222 0%,var(--wine) 45%,var(--dark) 100%);color:#fff;padding:calc(18px + var(--safe-t)) 20px 26px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#b8862b,var(--gold2),#b8862b)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;letter-spacing:.14em;color:#f5ead0;font-size:15px}
.brand svg{width:22px;height:22px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hello{font-size:13px;color:#f3e2dc}
.dayline{display:flex;align-items:flex-end;justify-content:space-between;margin-top:18px}
.phase{font-size:13px;color:var(--gold2)}
.bigday{font-family:var(--serif);font-size:64px;line-height:.9;font-weight:600;color:#fff}
.bigday small{font-size:22px;color:#f3e2dc;font-weight:500;margin-left:6px}
.daynav{display:flex;gap:8px}
.daynav button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(240,210,122,.5);color:var(--gold2);display:grid;place-items:center}
.daynav button:disabled{opacity:.3}
.pills{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;margin-top:18px}
.pill{height:16px;border-radius:8px;border:1px solid rgba(240,210,122,.45);background:transparent;padding:0}
.pill.on{background:linear-gradient(180deg,var(--gold2),#c99a2e);border-color:transparent}
.pill.cur{box-shadow:0 0 0 2px #fff}
.pills-leg{display:flex;justify-content:space-between;font-size:11.5px;color:#f3e2dc;margin-top:8px}
.backtoday{margin-top:12px;font-size:13px;color:var(--gold2);text-decoration:underline}
/* blocos */
.block{background:var(--paper);margin:14px 16px 0;border-radius:20px;padding:18px}
.block h3{font-size:21px;margin-bottom:10px}
.capsbtn{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1.5px solid var(--gold);background:#fffaf0;text-align:left;transition:background .2s}
.capsbtn .cap{width:46px;height:24px;border-radius:12px;border:1.5px solid var(--gold);position:relative;flex:none;overflow:hidden}
.capsbtn .cap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--rose)}
.capsbtn b{display:block;font-weight:600;color:var(--wine)}
.capsbtn span{font-size:13px;color:var(--muted)}
.capsbtn[aria-pressed=true]{background:linear-gradient(135deg,var(--wine),var(--dark));border-color:var(--wine)}
.capsbtn[aria-pressed=true] b{color:var(--gold2)}
.capsbtn[aria-pressed=true] span{color:#f3e2dc}
.capsbtn[aria-pressed=true] .cap{background:linear-gradient(90deg,var(--gold2) 50%,#fff 50%);border-color:var(--gold2)}

.meal .mt{flex:1;font-size:14.5px}
.rlink{color:var(--wine);font-weight:600;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;text-align:left;display:inline}

textarea,input[type=text],input[type=date],input[type=search],input[inputmode]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--dark);color:var(--gold2);padding:10px 18px;border-radius:30px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;white-space:nowrap}

.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:20}

.empty{padding:30px 20px;text-align:center;color:var(--muted)}

const FAQ = [["Como devo tomar o Secalyn?","Siga a dose e o horário indicados no rótulo, sempre com um copo cheio de água."],["Esqueci de tomar um dia. E agora?","Continue normalmente no próximo horário. Não tome dose dobrada para compensar."],["Preciso seguir o cardápio à risca?","Não. Ele é um guia pronto para facilitar: troque refeições entre dias ou repita as que mais gostou."],["Preciso treinar?","Não é obrigatório. Movimento leve soma ao resultado e melhora a disposição."],["Em quanto tempo vejo diferença?","Varia de pessoa para pessoa. Por isso o app acompanha medidas, que costumam mostrar mudança antes da balança."],["Senti algum desconforto. O que faço?","Confira se está bebendo água suficiente, já que a fórmula tem fibra. Se o desconforto continuar, suspenda o uso e procure um profissional de saúde."],["Posso repetir o protocolo?","Sim. Depois do dia 21, escolha uma nova data de início em Mais."]];
const CHECKIN_Q = ["O que funcionou melhor nesta semana?","Em que momento a rotina ficou difícil?","Qual receita você mais gostou?","O que você vai fazer diferente na próxima semana?"];

/* ===== armazenamento ===== */
let S = load();
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return {start:null,name:"",days:{},meas:{},checkins:{},shop:{}}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function dayData(n){ return S.days[n] || (S.days[n] = {caps:false,task:false,water:0,crave:null,note:""}); }

/* ===== datas ===== */
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function currentDay(){ if(!S.start) return 0; const t=parseISO(iso(new Date())), s=parseISO(S.start); return Math.round((t-s)/864e5)+1; }
function phaseOf(n){ return PHASES[Math.min(2,Math.floor((n-1)/7))]; }

/* ===== utilidades ===== */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RNAMES = DATA.recipes.map((r,i)=>({n:r.name,i})).sort((a,b)=>b.n.length-a.n.length);
const RPAT = new RegExp("("+RNAMES.map(x=>x.n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
function linkRecipes(t){ return esc(t).replace(RPAT, m=>{ const r=RNAMES.find(x=>x.n.toLowerCase()===m.toLowerCase()); return `<button class="rlink" data-recipe="${r.i}">${m}</button>`; }); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }
function vibrate(){ try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} }

/* ===== estado de navegação ===== */
let tab = "hoje", viewDay = null, sub = null, recFilter = "todas", recQuery = "", shopWeek = "1", measMetric = "cintura", ciWeek = 1;

function render(){
  const app=$("#app");
  if(!S.start){ $("#nav").hidden=true; app.innerHTML = onboarding(); bindOnb(); return; }
  $("#nav").hidden=false;
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===tab?"page":"false"));
  app.innerHTML = ({hoje:hoje, receitas:receitas, medidas:medidas, compras:compras, mais:mais})[tab]();
}

/* ===== onboarding ===== */
function onboarding(){
  return `<div class="onb">
  <div class="brand">${LEAF}SECALYN</div>
  <h1>Protocolo<em>Seca</em>21 dias</h1>
  <p class="lead">Sua rotina com o Secalyn, dia a dia: tarefa, cardápio, receitas e acompanhamento das suas medidas.</p>
  <label for="nm">Como podemos te chamar?</label>
  <input id="nm" type="text" autocomplete="given-name" placeholder="Seu nome (opcional)" maxlength="30">
  <label for="dt">Quando você começa?</label>
  <input id="dt" type="date" value="${iso(new Date())}">
  <button class="cta" id="go">Começar meu protocolo</button>
  <p class="fine">Seus dados ficam salvos só neste celular.</p></div>`;
}
function bindOnb(){
  $("#go").onclick=()=>{ const d=$("#dt").value||iso(new Date()); S.start=d; S.name=$("#nm").value.trim(); save(); tab="hoje"; viewDay=null; render(); window.scrollTo(0,0); };
}

/* ===== HOJE ===== */
function hoje(){
  const cur=currentDay();
  if(cur<1) return preStart(cur);
  if(cur>21 && viewDay===null) return finished();
  const n = viewDay ?? Math.min(cur,21);
  const D = DATA.days[n-1], dd = dayData(n), ph = phaseOf(n);
  const pills = Array.from({length:21},(_,i)=>{ const k=i+1, on=S.days[k]?.caps; return `<button class="pill ${on?"on":""} ${k===n?"cur":""}" data-goday="${k}" aria-label="Dia ${k}${on?", Secalyn tomado":""}"></button>`; }).join("");
  const taken = Object.values(S.days).filter(x=>x.caps).length;
  const water = Array.from({length:8},(_,i)=>`<button class="glass" data-water="${i+1}" aria-pressed="${i<dd.water}" aria-label="${i+1} copo${i?"s":""} de água"></button>`).join("");
  const meals = D.menu.map((m,i)=>`<div class="meal ${i===D.ri?"hi":""}"><span class="ml">${DATA.meals[i].replace("Café da manhã","Café")}</span><span class="mt">${linkRecipes(m)}</span></div>`).join("");
  const ri = DATA.recipes.findIndex(r=>r.name===D.recipe), R = DATA.recipes[ri];
  const isMeasDay = MEAS_DAYS.includes(n) && n>0, isCheckin = n%7===0;
  const hello = S.name ? `Olá, ${esc(S.name)}` : "Olá";
  return `<header class="hero">
    <div class="hero-top"><div class="brand">${LEAF}SECALYN</div><span class="hello">${hello}</span></div>
    <div class="dayline"><div><div class="phase">Fase ${ph.n} · ${ph.name}</div><div class="bigday">Dia ${n}<small>de 21</small></div></div>
    <div class="daynav"><button data-nav="-1" ${n<=1?"disabled":""} aria-label="Dia anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button><button data-nav="1" ${n>=21?"disabled":""} aria-label="Próximo dia"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button></div></div>
    <div class="pills">${pills}</div>
    <div class="pills-leg"><span>Secalyn em ${taken} de 21 dias</span><span>Dia 21</span></div>
    ${n!==Math.min(cur,21)?`<button class="backtoday" data-today>Voltar para hoje (dia ${Math.min(cur,21)})</button>`:""}
  </header>
  ${cur>=18 && n>=18 ? `<div class="banner"><b>Seu pote está chegando ao fim?</b><p>Para não interromper a rotina, garanta o próximo antes de acabar.</p><a class="cta" href="${CHECKOUT_URL}" target="_blank" rel="noopener">Garantir meu próximo Secalyn</a></div>`:""}
  <section class="block"><h3>Seu Secalyn de hoje</h3>
    <button class="capsbtn" data-caps aria-pressed="${dd.caps}"><span class="cap"></span><div><b>${dd.caps?"Secalyn tomado":"Tomei meu Secalyn"}</b><span>${dd.caps?"Ótimo. Agora é manter a água em dia.":"Na dose e no horário do rótulo, com um copo cheio de água"}</span></div></button>
    <h3 style="margin-top:20px">Água</h3>
    <div class="water">${water}</div>
    <div class="wcount"><span>${dd.water} de 8 copos</span><span>Toque em um copo para marcar</span></div>
  </section>
  <section class="block"><h3>Tarefa do dia</h3>
    <div class="task"><p>${esc(D.task)}</p><button class="tick" data-task aria-pressed="${dd.task}" aria-label="Marcar tarefa como feita"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></button></div>
  </section>
  <section class="block"><h3>Cardápio do dia</h3>${meals}</section>
  <button class="rday" data-recipe="${ri}"><small>Receita do dia · ${esc(R.meal)}</small><strong>${esc(R.name)}</strong><span>${esc(R.time)} · rende ${esc(R.yld)}</span></button>
  ${isMeasDay?`<div class="banner"><b>Dia de medidas</b><p>Registre peso, cintura e quadril para comparar com o dia 0.</p><button class="cta alt" data-goto="medidas">Registrar minhas medidas</button></div>`:""}
  ${isCheckin?`<div class="banner"><b>Check-in da semana ${n/7}</b><p>Cinco minutos para olhar para trás e planejar a próxima semana.</p><button class="cta alt" data-checkin="${n/7}">Fazer meu check-in</button></div>`:""}
  <section class="block"><h3>Como foi hoje?</h3>
    <label for="crave" class="muted" style="font-size:14px">Vontade de beliscar: <b id="cv" style="color:var(--wine)">${dd.crave??"–"}</b> de 10</label>
    <input class="slider" id="crave" type="range" min="0" max="10" step="1" value="${dd.crave??5}">
    <div class="scale"><span>Nenhuma</span><span>Muita</span></div>
    <textarea id="note" placeholder="Anotações do dia">${esc(dd.note)}</textarea>
  </section>
  <div style="height:8px"></div>`;
}
function preStart(cur){
  const left = 1-cur;
  return `<header class="hero"><div class="hero-top"><div class="brand">${LEAF}SECALYN</div><span class="hello">${S.name?`Olá, ${esc(S.name)}`:"Olá"}</span></div>
  <div class="dayline"><div><div class="phase">Preparação</div><div class="bigday">Dia 0</div></div></div>
  <p style="margin-top:12px;color:#f3e2dc">Seu protocolo começa em ${left} dia${left>1?"s":""}.</p></header>
  <section class="block"><h3>Antes de começar</h3>
  <div class="pillar"><div class="pnum">1</div><p><b>Registre suas medidas do dia 0.</b> Peso, cintura e quadril, pela manhã.</p></div>
  <div class="pillar"><div class="pnum">2</div><p><b>Faça as compras da semana 1.</b> A lista está na aba Compras.</p></div>
  <div class="pillar"><div class="pnum">3</div><p><b>Leia os 4 pilares</b> na aba Mais.</p></div>
  <button class="cta alt" style="margin-top:14px" data-goto="medidas">Registrar medidas do dia 0</button></section>`;
}
function finished(){
  const taken = Object.values(S.days).filter(x=>x.caps).length;
  return `<header class="hero"><div class="hero-top"><div class="brand">${LEAF}SECALYN</div></div>
  <div class="dayline"><div><div class="phase">Protocolo concluído</div><div class="bigday">21 dias</div></div></div>
  <p style="margin-top:12px;color:#f3e2dc">Você tomou o Secalyn em ${taken} dos 21 dias.</p></header>
  <section class="block done"><b>Parabéns por chegar até aqui</b><p class="muted" style="margin-top:6px">Vinte e um dias é tempo para criar uma rotina, não para chegar ao resultado final. Compare suas medidas e continue.</p></section>
  <div class="banner"><b>Continue sem interromper</b><p>Garanta o próximo pote e recomece o protocolo pela fase 2 com as receitas que você mais gostou.</p><a class="cta" href="${CHECKOUT_URL}" target="_blank" rel="noopener">Garantir meu próximo Secalyn</a></div>
  <section class="block"><button class="cta alt" data-goto="medidas">Ver minha evolução</button><button class="cta" style="margin-top:10px;background:#f1e6d4" data-review>Rever os 21 dias</button></section>`;
}

/* ===== RECEITAS ===== */
function receitas(){
  const chips=[["todas","Todas"],["cafe","Café da manhã"],["almoco","Almoço"],["lanche","Lanche"],["jantar","Jantar"]];
  const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); const q=norm(recQuery.trim());
  const list=DATA.recipes.map((r,i)=>({r,i})).filter(({r})=>(recFilter==="todas"||r.tags.includes(recFilter)) && (!q || norm(r.name).includes(q) || norm(r.ing.join(" ")).includes(q))).sort((a,b)=>a.r.name.localeCompare(b.r.name,"pt"));
  return `<div class="ptop"><h1>Receitas</h1><p>As 30 receitas do protocolo. Busque por nome ou ingrediente.</p></div>
  <div class="pad" style="margin-top:10px"><input type="search" id="rq" placeholder="Buscar: frango, abóbora, ovo…" value="${esc(recQuery)}" aria-label="Buscar receitas"></div>
  <div class="chips">${chips.map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${recFilter===k}">${l}</button>`).join("")}</div>
  <div class="rlist" id="rlist">${list.length?list.map(({r,i})=>`<button class="ritem" data-recipe="${i}"><div><b>${esc(r.name)}</b><span>${esc(r.meal)} · ${esc(r.time)}</span></div>${r.day?`<i>Dia ${r.day}</i>`:""}</button>`).join(""):`<p class="empty">Nenhuma receita com “${esc(recQuery)}”. Tente outro ingrediente.</p>`}</div>`;
}
function openRecipe(i){
  const r=DATA.recipes[i];
  openSheet(`<h1 id="sheettitle">${esc(r.name)}</h1>
  <div class="meta"><span>${esc(r.meal)}</span><span>${esc(r.time)}</span>${r.yld?`<span>Rende ${esc(r.yld)}</span>`:""}${r.day?`<span>Receita do dia ${r.day}</span>`:"<span>Receita base</span>"}</div>
  <h4>Ingredientes</h4><ul>${r.ing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <h4>Modo de preparo</h4><ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
  <div class="tip"><b>Combina com o Secalyn:</b> ${esc(r.tip)}</div>`);
}

/* ===== MEDIDAS ===== */
function medidas(){
  const rows=MEAS_DAYS.map(d=>{ const m=S.meas[d]||{}; return `<tr><td>Dia ${d}</td>${["peso","cintura","quadril"].map(k=>`<td><input inputmode="decimal" data-meas="${d}" data-k="${k}" value="${esc(m[k]??"")}" aria-label="${k} no dia ${d}" placeholder="–"></td>`).join("")}</tr>`; }).join("");
  const unit = measMetric==="peso"?"kg":"cm";
  const pts = MEAS_DAYS.map(d=>({d,v:parseFloat(String(S.meas[d]?.[measMetric]??"").replace(",","."))})).filter(p=>!isNaN(p.v));
  const deltas=["peso","cintura","quadril"].map(k=>{ const a=num(S.meas[0]?.[k]); const last=[21,14,7].map(d=>num(S.meas[d]?.[k])).find(v=>v!==null); if(a===null||last===null) return `<div><b>–</b><span>${k}</span></div>`; const df=(last-a); return `<div><b>${df>0?"+":""}${df.toFixed(1).replace(".",",")}</b><span>${k} (${k==="peso"?"kg":"cm"})</span></div>`; }).join("");
  return `<div class="ptop"><h1>Minhas medidas</h1><p>Registre nos dias 0, 7, 14 e 21, sempre pela manhã e nas mesmas condições.</p></div>
  <section class="block"><table class="mtable"><thead><tr><th></th><th>Peso (kg)</th><th>Cintura (cm)</th><th>Quadril (cm)</th></tr></thead><tbody>${rows}</tbody></table></section>
  <h2>Sua evolução</h2>
  <div class="seg" style="margin-top:0">${[["cintura","Cintura"],["quadril","Quadril"],["peso","Peso"]].map(([k,l])=>`<button data-metric="${k}" aria-pressed="${measMetric===k}">${l}</button>`).join("")}</div>
  <section class="block">${chart(pts,unit)}<div class="delta">${deltas}</div><p class="muted" style="font-size:12.5px;margin-top:10px">Diferença entre o dia 0 e a medida mais recente.</p></section>`;
}
function num(v){ const x=parseFloat(String(v??"").replace(",",".")); return isNaN(x)?null:x; }
function chart(pts,unit){
  const W=320,H=180,L=34,Rr=18,T=28,B=28;
  if(pts.length<2) return `<p class="empty" style="padding:24px 0">Registre pelo menos duas medidas para ver o gráfico.</p>`;
  const vs=pts.map(p=>p.v); let mn=Math.min(...vs), mx=Math.max(...vs); if(mx-mn<2){mn-=1;mx+=1;}
  const x=d=>L+(d/21)*(W-L-Rr), y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const path=pts.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const grid=[mn,(mn+mx)/2,mx].map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#ead9bd" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#7d6a66">${v.toFixed(0)}</text>`).join("");
  const xl=MEAS_DAYS.map(d=>`<text x="${x(d)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#7d6a66">Dia ${d}</text>`).join("");
  const dots=pts.map(p=>`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="5" fill="#7a1416" stroke="#f0d27a" stroke-width="2"/><text x="${x(p.d)}" y="${y(p.v)-10}" text-anchor="middle" font-size="11" font-weight="600" fill="#7a1416">${String(p.v).replace(".",",")}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução em ${unit}">${grid}${xl}<path d="${path}" fill="none" stroke="#c99a2e" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ===== COMPRAS ===== */
function compras(){
  const tabs=[["1","Semana 1"],["2","Semana 2"],["3","Semana 3"],["d","Despensa"]];
  const groups = shopWeek==="d" ? [{g:"Despensa básica",items:DATA.pantry}] : DATA.weeks[shopWeek];
  const body = groups.map(gr=>`<section class="block group"><h3>${esc(gr.g)}</h3>${gr.items.map(it=>{ const k=shopWeek+"|"+it; return `<button class="item" data-shop="${esc(k)}" aria-pressed="${!!S.shop[k]}"><span class="tick" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></span><span>${esc(it)}</span></button>`; }).join("")}</section>`).join("");
  const intro = shopWeek==="d" ? "Itens usados nas três semanas. Confira antes de cada compra." : `Tudo para os dias ${(shopWeek-1)*7+1} a ${shopWeek*7}, para uma pessoa.`;
  return `<div class="ptop"><h1>Compras</h1><p>${intro}</p></div>
  <div class="seg">${tabs.map(([k,l])=>`<button data-week="${k}" aria-pressed="${shopWeek===k}">${l}</button>`).join("")}</div>
  ${body}<div class="pad" style="margin-top:14px"><button class="cta" style="background:#f1e6d4" data-clearshop>Desmarcar todos desta lista</button></div>`;
}

/* ===== MAIS ===== */
function mais(){
  return `<div class="ptop"><h1>Mais</h1><p>Check-ins, guias e configurações.</p></div>
  <div class="menu-list"><button data-sub="checkin">Check-ins semanais</button><button data-sub="pilares">Os 4 pilares</button><button data-sub="faq">Perguntas frequentes</button><button data-sub="instalar">Colocar o app na tela inicial</button></div>
  <div class="menu-list"><button data-sub="inicio">Alterar data de início</button><a class="cta" style="border-radius:0;background:#fff;color:var(--wine);text-align:left;padding:17px 18px;font-weight:400" href="${CHECKOUT_URL}" target="_blank" rel="noopener">Comprar Secalyn</a><button data-sub="suporte">Suporte</button><button data-sub="apagar" class="danger">Apagar meus dados</button></div>
  <p class="muted" style="text-align:center;font-size:12px;margin:22px 20px">Este app é educativo e não substitui o acompanhamento de um profissional de saúde. Use o Secalyn conforme o rótulo.</p>`;
}
function openSub(k){
  if(k==="checkin") return openCheckin(ciWeek);
  if(k==="pilares") return openSheet(`<h1 id="sheettitle">Os 4 pilares</h1><div class="body" style="margin-top:10px">${PILARES.map((p,i)=>`<div class="pillar"><div class="pnum">${i+1}</div><p><b>${p[0]}.</b> ${p[1]}</p></div>`).join("")}<div class="tip" style="margin:14px 0 0">Nos dias corridos, priorize os pilares 1 e 2. Eles sozinhos já mantêm a rotina.</div></div>`);
  if(k==="faq") return openSheet(`<h1 id="sheettitle">Perguntas frequentes</h1><div class="body" style="margin-top:6px">${FAQ.map(f=>`<div class="faq"><b>${f[0]}</b><p>${f[1]}</p></div>`).join("")}</div>`);
  if(k==="instalar") return openSheet(`<h1 id="sheettitle">Na tela inicial</h1><div class="body" style="margin-top:10px"><h4 style="margin:6px 0">No iPhone</h4><p>Abra este link no Safari, toque no botão de compartilhar (o quadrado com a seta) e escolha “Adicionar à Tela de Início”.</p><h4 style="margin:6px 0">No Android</h4><p>Abra no Chrome, toque nos três pontinhos do canto e escolha “Adicionar à tela inicial” ou “Instalar app”.</p><p class="muted">Depois disso, o Secalyn aparece como um app no seu celular.</p></div>`);
  if(k==="inicio") { openSheet(`<h1 id="sheettitle">Data de início</h1><div class="body" style="margin-top:10px"><p>Mude a data se você começou em outro dia ou quer recomeçar o protocolo. Suas marcações e medidas continuam salvas.</p><input type="date" id="newstart" value="${S.start}"><button class="cta alt" style="margin-top:14px" id="savestart">Salvar data</button></div>`); $("#savestart").onclick=()=>{ const v=$("#newstart").value; if(v){ S.start=v; save(); viewDay=null; closeSheet(); render(); toast("Data de início salva"); } }; return; }
  if(k==="suporte") return openSheet(`<h1 id="sheettitle">Suporte</h1><div class="body" style="margin-top:10px"><p>Ficou com alguma dúvida sobre o protocolo ou o seu pedido? Fale com a gente:</p><a class="cta alt" href="mailto:${SUPORTE}">${SUPORTE}</a></div>`);
  if(k==="apagar") { openSheet(`<h1 id="sheettitle">Apagar meus dados</h1><div class="body" style="margin-top:10px"><p>Isso apaga sua data de início, marcações, medidas, check-ins e listas deste celular. Não dá para desfazer.</p><button class="cta alt" id="wipe">Apagar tudo</button></div>`); $("#wipe").onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} S=load(); closeSheet(); tab="hoje"; render(); }; return; }
}
function openCheckin(w){
  ciWeek=w; const a=S.checkins[w]||[];
  const days=[1,2,3,4,5,6,7].map(i=>(w-1)*7+i);
  const caps=days.filter(d=>S.days[d]?.caps).length, wat=days.filter(d=>(S.days[d]?.water||0)>=8).length;
  const cr=days.map(d=>S.days[d]?.crave).filter(v=>v!==null&&v!==undefined); const avg=cr.length?(cr.reduce((x,y)=>x+y,0)/cr.length).toFixed(1).replace(".",","):"–";
  openSheet(`<h1 id="sheettitle">Check-in</h1>
  <div class="seg" style="margin:10px 20px 0">${[1,2,3].map(k=>`<button data-ciw="${k}" aria-pressed="${k===w}">Semana ${k}</button>`).join("")}</div>
  <div class="body"><div class="delta" style="margin:14px 0 4px"><div><b>${caps}/7</b><span>dias com Secalyn</span></div><div><b>${wat}/7</b><span>dias com 8 copos</span></div><div><b>${avg}</b><span>vontade média</span></div></div>
  ${CHECKIN_Q.map((q,i)=>`<div class="q"><label for="ci${i}">${q}</label><textarea id="ci${i}" data-ci="${i}">${esc(a[i]||"")}</textarea></div>`).join("")}
  <button class="cta alt" style="margin-top:14px" id="cisave">Salvar check-in</button></div>`);
  $("#cisave").onclick=()=>{ S.checkins[w]=CHECKIN_Q.map((_,i)=>$("#ci"+i).value); save(); toast("Check-in salvo"); closeSheet(); };
}

/* ===== folha ===== */
let lastFocus=null;
function openSheet(html){ lastFocus=document.activeElement; const s=$("#sheet"); s.innerHTML=`<div class="sheet-h"><span class="grab"></span><button class="close" data-close aria-label="Fechar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${html}`; s.scrollTop=0; s.classList.add("open"); $("#sheetbg").classList.add("open"); document.body.style.overflow="hidden"; setTimeout(()=>$(".close",s).focus(),50); }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#sheetbg").classList.remove("open"); document.body.style.overflow=""; if(lastFocus) try{lastFocus.focus();}catch(e){} }

/* ===== eventos ===== */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-goto]"); if(!t) return;
  const ds=t.dataset;
  if(ds.tab){ tab=ds.tab; sub=null; if(tab==="hoje") viewDay=null; render(); window.scrollTo(0,0); return; }
  if(ds.close!==undefined){ closeSheet(); return; }
  if(ds.recipe!==undefined){ openRecipe(+ds.recipe); return; }
  if(ds.nav){ const cur=Math.min(Math.max(currentDay(),1),21); const n=(viewDay??cur)+(+ds.nav); viewDay=Math.max(1,Math.min(21,n)); render(); return; }
  if(ds.goday){ viewDay=+ds.goday; render(); return; }
  if(ds.today!==undefined){ viewDay=null; render(); return; }
  if(ds.review!==undefined){ viewDay=21; render(); window.scrollTo(0,0); return; }
  if(ds.caps!==undefined){ const n=viewDay??Math.min(currentDay(),21); const d=dayData(n); d.caps=!d.caps; save(); vibrate(); render(); if(d.caps) toast("Secalyn do dia "+n+" marcado"); return; }
  if(ds.water){ const n=viewDay??Math.min(currentDay(),21); const d=dayData(n); const v=+ds.water; d.water=(d.water===v)?v-1:v; save(); vibrate(); render(); if(d.water===8) toast("Meta de água do dia batida"); return; }
  if(ds.task!==undefined){ const n=viewDay??Math.min(currentDay(),21); const d=dayData(n); d.task=!d.task; save(); vibrate(); render(); return; }
  if(ds.goto){ tab=ds.goto; render(); window.scrollTo(0,0); return; }
  if(ds.checkin){ openCheckin(+ds.checkin); return; }
  if(ds.ciw){ openCheckin(+ds.ciw); return; }
  if(ds.filter){ recFilter=ds.filter; render(); return; }
  if(ds.metric){ measMetric=ds.metric; render(); return; }
  if(ds.week){ shopWeek=ds.week; render(); return; }
  if(ds.shop){ S.shop[ds.shop]=!S.shop[ds.shop]; save(); t.setAttribute("aria-pressed",S.shop[ds.shop]); return; }
  if(ds.clearshop!==undefined){ Object.keys(S.shop).forEach(k=>{ if(k.startsWith(shopWeek+"|")) delete S.shop[k]; }); save(); render(); return; }
  if(ds.sub){ openSub(ds.sub); return; }
});
$("#sheetbg").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#sheet").classList.contains("open")) closeSheet(); });
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="crave"){ const n=viewDay??Math.min(currentDay(),21); dayData(n).crave=+t.value; $("#cv").textContent=t.value; save(); }
  if(t.id==="note"){ const n=viewDay??Math.min(currentDay(),21); dayData(n).note=t.value; save(); }
  if(t.id==="rq"){ recQuery=t.value; const pos=t.selectionStart; render(); const r=$("#rq"); r.focus(); try{r.setSelectionRange(pos,pos);}catch(_){} }
  if(t.dataset.meas!==undefined){ const d=t.dataset.meas; S.meas[d]=S.meas[d]||{}; S.meas[d][t.dataset.k]=t.value; save(); }
});
document.addEventListener("change",e=>{ if(e.target.dataset.meas!==undefined && tab==="medidas"){ const y=window.scrollY; render(); window.scrollTo(0,y); } });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && tab==="hoje" && viewDay===null) render(); });
render();
</script>
</body>
</html>
